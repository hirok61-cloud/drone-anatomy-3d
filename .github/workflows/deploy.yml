# push のたびに src/ から再ビルドし、コミット済みの public/index.html と食い違わないか検査する。
#
# 実際のデプロイは Cloudflare Workers Builds（GitHub連携・2026-09-11 接続済み）が行うため、
# このワークフローは通常デプロイしない。CLOUDFLARE_API_TOKEN が未設定の間は検査だけして終わる。
#
# Workers Builds をやめて Actions からデプロイしたくなったら、リポジトリの
#   Settings → Secrets and variables → Actions
# に CLOUDFLARE_API_TOKEN（Workers Scripts:Edit）と
# CLOUDFLARE_ACCOUNT_ID（f04e60458a99ec1d7dcd69240e6ff9dc）を登録する。
# その場合は Cloudflare 側の Git 接続を解除しないと二重にデプロイされる。
name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ビルド（src/ から public/index.html を再生成）
        run: python3 build.py

      - name: 生成物がコミット漏れしていないか検査
        run: |
          if ! git diff --quiet -- public/ artifact.html; then
            echo "::error::public/index.html が src/ と食い違っています。ローカルで python3 build.py を実行してコミットしてください。"
            git diff --stat -- public/ artifact.html
            exit 1
          fi

      - name: デプロイの可否を判定
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN が未設定のためデプロイを飛ばします（ビルド検査のみ実行）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: デプロイ
        if: steps.gate.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
