<meta charset="utf-8">
<title>ドローンの構造</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/*INLINE:style.css*/
</style>

<div id="stage">
  <canvas id="gl" aria-label="ドローンの3Dモデル"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
  <div id="badges"></div>
</div>

<div id="dock" class="glass" role="toolbar" aria-label="操作">
  <div id="ctx" class="ctx">
    <div class="ctx-row" data-tab="see">
      <button id="inspToggle" class="pill-btn compact-only">部品一覧</button>
      <div class="dock-group grow"><label for="explode">分解 <span id="explodeVal" class="mono">0%</span></label><input type="range" id="explode" min="0" max="100" value="0"></div>
      <div class="dock-group"><label>見え方</label><div class="seg small" id="modeSeg" role="radiogroup"><button data-mode="normal" class="on"><span data-simple>ふつう</span><span data-fullname>通常</span></button><button data-mode="xray"><span data-simple>すけて見る</span><span data-fullname>X線</span></button><button data-mode="wire"><span data-simple>線だけ</span><span data-fullname>線画</span></button><button data-mode="cut"><span data-simple>切って見る</span><span data-fullname>断面</span></button><button data-mode="blueprint" data-unlock hidden>設計図</button></div></div>
    </div>
    <div class="ctx-row" data-tab="fly" hidden>
      <button id="powerBtn" class="pill-btn primary">▶ プロペラを回す</button>
      <div class="seg small" id="powerSeg" data-full><button data-p="0.2">低速</button><button data-p="0.5" class="on">ホバー</button><button data-p="1">全開</button></div>
      <div class="chips">
        <button class="tgl" data-t="slow" aria-pressed="false"><i></i>ゆっくり</button>
        <button class="tgl" data-t="air" aria-pressed="false"><i></i>風をみる</button>
        <button class="tgl" data-t="arrows" aria-pressed="false"><i></i>まわる向き</button>
        <button class="tgl" data-t="sticks" aria-pressed="false"><i></i>スティック</button>
        <button class="tgl" data-t="tilt" id="tiltBtn" hidden aria-pressed="false"><i></i>かたむき</button>
      </div>
      <div class="dock-group"><label>飛行の原理</label><div class="chips" id="flightChips"><button data-f="hover">ホバリング</button><button data-f="climb" data-full>上昇</button><button data-f="pitch">前進</button><button data-f="roll" data-full>右へ移動</button><button data-f="yaw">右旋回</button></div></div>
    </div>
    <div class="ctx-row" data-tab="use" hidden>
      <div class="dock-group"><label>なにに使う？</label><div class="chips" id="useChips"></div></div>
      <button id="useReset" class="pill-btn" hidden>もどす</button>
      <button id="scaleBtn" class="pill-btn" aria-pressed="false">重さ・お金</button>
    </div>
    <div class="ctx-row" data-tab="mishap" hidden>
      <div class="dock-group grow"><label>もしも、まちがえたら</label><div class="cards" id="mishapCards"></div></div>
      <div class="dock-group grow"><label>もしも、外でこうなったら</label><div class="cards" id="whatifCards"></div></div>
    </div>
    <div class="ctx-row" data-tab="theater" hidden>
      <button id="thQuit" class="pill-btn">✕ やめる</button>
      <div class="stages" id="thStages"></div>
      <button id="thNext" class="pill-btn primary">つぎへ ›</button>
      <button class="tgl" data-t="slow" id="thSlow" aria-pressed="false"><i></i>ゆっくり</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button data-tab="see" class="on" role="tab" aria-selected="true"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="3"/><path d="M2 10s3-5.5 8-5.5 8 5.5 8 5.5-3 5.5-8 5.5S2 10 2 10z"/></svg><span data-i18n="tabs.see">みる</span></button>
    <button data-tab="fly" role="tab" aria-selected="false"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3v14M3 10h14M5 5l10 10M15 5L5 15"/></svg><span data-i18n="tabs.fly">とばす</span></button>
    <button data-tab="use" role="tab" aria-selected="false"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14v9H3zM7 7V4h6v3"/></svg><span data-i18n="tabs.use">つかう</span></button>
    <button data-tab="mishap" role="tab" aria-selected="false"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l8 14H2z"/><path d="M10 8v4M10 14.5v.5"/></svg><span data-i18n="tabs.mishap">もしも</span></button>
  </nav>
</div>

<header id="topbar" class="glass">
  <div class="brand">
    <h1>ドローンの構造</h1>
    <div class="seg tiny" id="depthSeg" role="radiogroup" aria-label="くわしさ"><button data-d="simple" class="on" data-i18n="depth.simple">はじめて</button><button data-d="full" data-i18n="depth.full">くわしく</button></div>
  </div>
  <div class="top-actions">
    <button id="askBtn" class="pill-btn" aria-haspopup="dialog"><span class="q">？</span><span data-i18n="ask">きく</span></button>
    <button id="settingsBtn" class="icon-btn" aria-label="設定" title="設定">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div id="settings" class="glass popover" hidden>
  <div class="pop-row lesson-row"><button id="lessonBtn" class="pill-btn primary">授業・説明会 ›</button><button id="quizBtn" class="pill-btn">ふたりクイズ</button></div>
  <div class="pop-row"><span>言語</span><div class="seg small" id="langSeg"><button data-lang="ja" class="on">日本語</button><button data-lang="easy">やさしい日本語</button><button data-lang="en">English</button></div></div>
  <div class="pop-row"><span>機体</span><button class="tgl on" data-t="alive" aria-pressed="true"><i></i>浮かせておく</button></div>
  <p class="pop-foot" id="aliveNote" hidden>軽量画質では止まっています</p>
  <div class="pop-row"><span>表示</span><button class="tgl" data-t="big" aria-pressed="false"><i></i>大きく読む</button></div>
  <div class="pop-row speakrow"><span>読み上げ</span><button class="tgl speak" data-t="speakAuto" aria-pressed="false"><i></i>選ぶと自動で読む</button></div>
  <div class="pop-row"><span>テーマ</span><div class="seg small" id="themeSeg"><button data-th="auto" class="on">システム</button><button data-th="light">ライト</button><button data-th="dark">ダーク</button></div></div>
  <div class="pop-row"><span>文字の大きさ</span><div class="seg small" id="fontSeg"><button data-f="1" class="on">標準</button><button data-f="1.18">大</button></div></div>
  <div class="pop-row"><span>品質</span><div class="seg small" id="qualitySeg"><button data-q="auto" class="on">自動</button><button data-q="3">最高</button><button data-q="2">高</button><button data-q="1">標準</button><button data-q="0">軽量</button></div></div>
  <details class="pop-more"><summary>詳細</summary>
    <div class="pop-row"><span>環境光</span><input type="range" id="envSlider" min="30" max="160" value="100" aria-label="環境光の強さ"></div>
    <div class="pop-row"><span>露出</span><input type="range" id="expSlider" min="60" max="150" value="100" aria-label="露出"></div>
    <div class="pop-row"><span>影</span><button class="tgl on" data-t="shadows" aria-pressed="true"><i></i>影を描く</button></div>
    <p class="pop-foot" id="perfInfo">—</p>
    <p class="pop-foot">キー操作: 1〜4 表示モード / E 分解 / Space プロペラ / S ゆっくり / A 風 / L ラベル / R 視点リセット / F 注目 / ? この一覧 / Esc 閉じる</p>
  </details>
</div>
<div id="askPop" class="glass popover" hidden role="dialog" aria-label="きいてみよう">
  <h3>きいてみよう</h3>
  <div id="askList"></div>
</div>

<div id="lessonPop" class="glass popover" hidden role="dialog" aria-label="授業・説明会"></div>

<div id="photoPop" class="glass popover" hidden role="dialog" aria-label="記念写真">
<h3>記念写真</h3>
<img id="photoImg" alt="この画面の記念写真">
<p class="pop-foot">画像を長押し（右クリック）で保存できます。</p>
<div class="note-actions"><button id="photoClose">閉じる</button></div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<div id="coach" class="glass" hidden>
  <p id="coachText"></p>
  <p class="coach-sub" id="coachSub"></p>
  <div class="coach-actions"><button id="coachGo" class="primary">見てみる</button><button id="coachLater">あとで</button></div>
</div>

<div id="viewCol" class="glass" aria-label="視点">
  <button data-v="iso" class="on" title="斜め" data-i18n="views.iso">斜</button><button data-v="front" title="前" data-i18n="views.front">前</button><button data-v="top" title="上" data-i18n="views.top">上</button><button data-v="side" title="横" data-full data-i18n="views.side">横</button><button data-v="inside" title="モーター内部" data-full data-i18n="views.inside">内</button>
  <hr><button class="tgl on" data-t="labels" aria-pressed="true" title="ラベル"><i></i><span data-i18n="views.labels">名</span></button><button id="bigBtn" title="大きく読む" aria-pressed="false" data-i18n="big">大</button><button id="photoBtn" title="記念写真">📷</button><button id="fsBtn" title="全画面">⤢</button>
</div>

<div id="noteCard" class="glass" hidden aria-live="polite">
  <div class="note-head"><h3 id="noteTitle"></h3><span id="noteBadge" class="badge" hidden></span><button id="noteClose" class="icon-btn sm" aria-label="閉じる">✕</button></div>
  <div id="noteBody"></div>
  <div id="noteActions" class="note-actions"></div>
</div>

<div id="bigBand" class="glass" hidden aria-live="polite"><span id="bigText"></span><button id="bigSpeak" class="icon-btn sm speak" aria-label="読み上げ" title="読み上げ">🔊</button></div>

<aside id="massBar" class="glass" hidden aria-label="重さの内訳">
  <div class="mb-top"><div class="seg small" id="payloadSeg"></div><button id="priceBtn" class="pill-btn" aria-pressed="false" title="参考価格を見る">¥</button></div>
  <div class="mb-main"><div class="mb-stack" id="massStack"></div><div class="mb-legend" id="massLegend"></div></div>
  <div class="mb-foot"><b id="massTotal">—</b><span id="massSub" class="mb-sub"></span><div id="massPrice" class="mb-price" hidden></div><p id="massNote" class="mb-note" hidden></p></div>
</aside>

<aside id="lesson" class="glass" hidden aria-label="授業の台本">
  <div class="grabber" aria-hidden="true"></div>
  <div class="insp-head lesson-head">
    <div class="lesson-title"><h2 id="lessonName"></h2><span id="lessonAud"></span></div>
    <span id="lessonClock" class="count">--:-- / --:--</span>
    <button id="lessonClose" class="icon-btn sm" aria-label="閉じる">✕</button>
  </div>
  <div id="lessonSel" hidden></div>
  <div id="lessonSteps"></div>
  <div class="lesson-foot">
    <button id="lessonPrev" class="icon-btn sm" aria-label="前の段落">‹</button><span id="lessonPos" class="count"></span><button id="lessonNext" class="icon-btn sm" aria-label="次の段落">›</button>
    <span class="sp"></span>
    <button id="lessonQuiz" class="pill-btn">ふたりクイズ</button><button id="lessonPrint" class="pill-btn">印刷</button><button id="lessonEnd" class="pill-btn">終了</button>
  </div>
</aside>

<aside id="inspector" class="glass" aria-label="部品一覧と解説">
  <div class="grabber" aria-hidden="true"></div>
  <div class="insp-head">
    <button id="inspBack" class="icon-btn sm" aria-label="一覧へ" hidden>‹</button>
    <h2 id="inspTitle">部品</h2><span id="partCount" class="count"></span><span id="codexCount" class="count codex" title="見た部品"></span>
    <button id="inspClose" class="icon-btn sm" aria-label="閉じる">✕</button>
  </div>
  <div id="inspBody">
    <div id="partList"></div>
    <div id="detail" hidden></div>
  </div>
</aside>

<div id="sticks" hidden>
  <div class="stick" id="stickL"><div class="knob"></div><span class="lbl t"></span><span class="lbl b"></span><span class="lbl l"></span><span class="lbl r"></span></div>
  <div class="stick-mid"><div class="seg tiny" id="modeSeg2"><button data-m="1" class="on">モード1</button><button data-m="2">モード2</button></div></div>
  <div class="stick" id="stickR"><div class="knob"></div><span class="lbl t"></span><span class="lbl b"></span><span class="lbl l"></span><span class="lbl r"></span></div>
</div>

<div id="printSheet" aria-hidden="true"></div>

<div id="loading"><div class="spinner"></div><p id="loadMsg">3Dモデルを生成しています…</p></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script>
window.__droneReady = false;
window.__showErr = function (msg) { var m = document.getElementById('loadMsg'); if (m) { m.textContent = msg; m.classList.add('err'); } var sp = document.querySelector('#loading .spinner'); if (sp) sp.style.display = 'none'; };
window.addEventListener('error', function (e) { if (!window.__droneReady) window.__showErr('読み込みエラー: ' + (e.message || e.type)); });
setTimeout(function () { if (!window.__droneReady && !window.__droneStarted) window.__showErr('3Dライブラリの読み込みに時間がかかっています。ネットワーク接続を確認して再読み込みしてください。'); }, 25000);
</script>
<script type="module">
window.__droneStarted = true;
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { CopyShader } from 'three/addons/shaders/CopyShader.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';
/*INLINE:scripts*/
</script>
