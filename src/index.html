<title>ドローンの構造</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/*INLINE:style.css*/
</style>

<div id="stage">
  <canvas id="gl" aria-label="ドローンの3Dモデル"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
</div>

<header id="topbar" class="glass">
  <div class="brand">
    <h1>ドローンの構造</h1>
    <p>550クラス クアッドコプター · 部品をクリックで解説</p>
  </div>
  <div class="seg" id="modeSeg" role="tablist" aria-label="表示モード">
    <button data-mode="normal" class="on" role="tab" aria-selected="true">通常</button>
    <button data-mode="xray" role="tab">X線</button>
    <button data-mode="wire" role="tab">線画</button>
    <button data-mode="cut" role="tab">断面</button>
  </div>
  <button id="settingsBtn" class="icon-btn" aria-label="設定" title="設定">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
  </button>
  <div id="settings" class="glass popover" hidden>
    <div class="pop-row"><span>品質</span>
      <div class="seg small" id="qualitySeg"><button data-q="auto" class="on">自動</button><button data-q="2">高</button><button data-q="1">標準</button><button data-q="0">軽量</button></div></div>
    <div class="pop-row"><span>テーマ</span>
      <div class="seg small" id="themeSeg"><button data-th="auto" class="on">システム</button><button data-th="light">ライト</button><button data-th="dark">ダーク</button></div></div>
    <div class="pop-row"><span>環境光</span><input type="range" id="envSlider" min="30" max="160" value="100" aria-label="環境光の強さ"></div>
    <div class="pop-row"><span>影</span><button class="tgl on" data-t="shadows" id="shadowTgl"><i></i>影を描く</button></div>
    <p class="pop-foot" id="perfInfo">—</p>
  </div>
</header>

<aside id="inspector" class="glass" aria-label="部品一覧と解説">
  <div class="grabber" aria-hidden="true"></div>
  <div class="insp-head">
    <h2>部品</h2><span id="partCount" class="count"></span>
    <button id="inspClose" class="icon-btn" aria-label="閉じる"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div id="detail" hidden></div>
  <div id="partList"></div>
</aside>

<div id="dock" class="glass" role="toolbar" aria-label="操作">
  <div class="dock-group grow">
    <label for="explode">分解 <span id="explodeVal" class="mono">0%</span></label>
    <input type="range" id="explode" min="0" max="100" value="0">
  </div>
  <div class="dock-group">
    <label>モーター</label>
    <div class="seg small" id="powerSeg"><button data-p="0" class="on">停止</button><button data-p="0.2">低速</button><button data-p="0.5">ホバー</button><button data-p="1">全開</button></div>
  </div>
  <div class="dock-group">
    <label>飛行の原理</label>
    <div class="chips" id="flightChips"><button data-f="hover">ホバリング</button><button data-f="climb">上昇</button><button data-f="pitch">前進</button><button data-f="roll">右へ移動</button><button data-f="yaw">右旋回</button></div>
  </div>
  <div class="dock-group">
    <label>表示</label>
    <div class="chips"><button class="tgl on" data-t="labels"><i></i>ラベル</button><button class="tgl" data-t="arrows"><i></i>回転方向</button><button class="tgl on" data-t="autorotate"><i></i>自動回転</button></div>
  </div>
  <div class="dock-group">
    <label>視点</label>
    <div class="seg small" id="viewSeg"><button data-v="iso" class="on">斜め</button><button data-v="front">前</button><button data-v="top">上</button><button data-v="side">横</button><button data-v="inside">モーター</button></div>
  </div>
  <button id="fsBtn" class="icon-btn" aria-label="全画面" title="全画面">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg>
  </button>
</div>

<div id="flightNote" class="glass" hidden></div>
<div id="hiddenBar" class="glass" hidden><span id="hiddenMsg"></span><button id="showAll">すべて表示</button></div>
<div id="hint" class="glass">ドラッグで回転 · ホイールで拡大 · 部品をクリックで解説</div>
<button id="inspToggle" class="glass fab" aria-label="部品一覧を開く">部品一覧</button>

<div id="loading"><div class="spinner"></div><p id="loadMsg">3Dモデルを生成しています…</p></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script>
window.__droneReady = false;
window.__showErr = function (msg) { var m = document.getElementById('loadMsg'); if (m) { m.textContent = msg; m.classList.add('err'); } var sp = document.querySelector('#loading .spinner'); if (sp) sp.style.display = 'none'; };
window.addEventListener('error', function (e) { if (!window.__droneReady) window.__showErr('読み込みエラー: ' + (e.message || e.type)); });
setTimeout(function () { if (!window.__droneReady && !window.__droneStarted) window.__showErr('3Dライブラリの読み込みに時間がかかっています。ネットワーク接続を確認して再読み込みしてください。'); }, 25000);
</script>
<script type="module">
window.__droneStarted = true;
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
/*INLINE:scripts*/
</script>
