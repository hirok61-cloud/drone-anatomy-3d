# 改修パッケージ⑥〜⑩ 実行書・作業計画書

作成: 2026-09-11 / 対象リポジトリ: `hirok61-cloud/drone-anatomy-3d`（ローカル `~/Desktop/ドローン関連/ドローン構造3D/`）
読者: これから実装を担当するモデル（Sonnet / Opus）。**この文書だけで作業が完結する**ように、設計判断・数値・文章はすべてここで確定させてある。迷ったら「決定事項」に従い、判断が要る所は「実装者の裁量」と明記した所だけ自分で決めること。

---

## 0. 全体方針（先に読む）

### 0.1 何を作るか
改修メニュー（`docs/proposals/2026-09-11-improvement-menu.html`）の第6〜10位。

| # | 名前 | 一言 | 重さ | 主に触るファイル |
|---|---|---|---|---|
| ⑥ | 重さ・お金・重心 | 重さの積み上げバー、参考価格タグ、バッテリーをずらすと前後のモーター%が変わる、人型スケール | M | data.js, drone.js, physics.js, 新規 `scale.js`, ui.js, index.html, style.css |
| ⑦ | 図鑑とカード | 見た部品に「発見済み」、右上に 12/40、今日の一部品が光る、全部見たら設計図モード、記念写真 | S | data.js, 新規 `codex.js`, ui.js, index.html, style.css |
| ⑧ | 生きている機体と、みんなの土台 | 開いた瞬間からホバー、ポインタの方へ数度向く、「大きく」帯、日本語／やさしい日本語／English、読み上げ | S〜M | data.js, physics.js, 新規 `live.js`, ui.js, index.html, style.css |
| ⑨ | 授業・説明会モード | 45分授業・10分説明会の台本が右に固定、段落ごとに視点と表示が切替、部品めぐり、ふたりクイズ、印刷ワークシート | M | data.js, 新規 `lesson.js`, ui.js, index.html, style.css, build.py |
| ⑩ | もしもの5場面 | 電波切れ・電池少・GPS喪失・強風・人が近づいた → 機体が小さく反応し、働く部品が順に光る。最後に「機体ができること／人がやること」 | M | data.js, 新規 `whatif.js`, physics.js, ui.js, index.html, style.css |

### 0.2 実装順（決定）
1. **⑥ 重さ・お金・重心** — データ追加が中心、既存の `setTint`/`renderNote`/ラベル機構を流用。まずここで「新規モジュールを足す作法」を確立する。
2. **⑦ 図鑑とカード** — `select()` に1行フックするだけで動く。写真機能でキャンバス取得の作法を確立する。
3. **⑩ もしもの5場面** — ⑤シアターの隣に置く。`body` を書く小さなタイムラインエンジンを作る（⑧⑨が再利用）。
4. **⑧ 生きている機体と土台** — 起動時ホバーは全画面に影響するので、⑥⑦⑩が安定してから。言語・大きく・読み上げは⑨の前提。
5. **⑨ 授業・説明会モード** — ①〜⑩の機能を台本から呼ぶ統合パッケージ。最後。

各パッケージは **1コミット以上・単独でデプロイ可能** な単位で進める。前のパッケージが未マージでも壊れないよう、機能の入口（ボタン・チップ）は該当データが無ければ描画しない。

### 0.3 変えてはいけないもの
- 既存の①〜⑤の挙動と、`docs/design/*.md` の設計（特に `2026-09-11-ui-spec.md` の「排他ルール」と「はじめて／くわしく」）。
- `src/` を直して `python3 build.py` を回す運用。**`public/index.html` と `artifact.html` を直接編集しない。**
- ビルド出力の決定性（日付・乱数をHTMLに埋めない）。CI「Build check」は `python3 build.py` 後に差分が無いことを検査する。
- 品質段階 `applyQuality(0〜3)`（engine.js）と自動降格。新規の3D要素は **オフ時に draw call を増やさない**（`visible=false` か `scene` から外す）。
- レンダリング経路（ScenePass→GTAO→Outline→Output→finish）。ポスト処理を足さない。
- `[hidden]{display:none!important}` 前提の hidden 属性運用、`body.full` / `[data-full]` による深さ切替、`--dock-h` の実測。

### 0.4 コードの現状（実装者向け早見表）
- **ビルド**: `build.py` の `SOURCES = ['data.js','materials.js','drone.js','engine.js','physics.js','airflow.js','theater.js','ui.js','app.js']` の順で1本の `<script type="module">` に連結される。**新規ファイルは `theater.js` の後・`ui.js` の前** に入れる（`renderNote` 等の関数宣言は巻き上がるので前後どちらからでも呼べるが、`const` は定義行が実行されるまで使えない。新規モジュール内では **トップレベルで ui.js の const（`store`, `ACCENT` など）を参照しない**。関数の中からなら可）。
- **起動**: `app.js` 末尾の即時関数。`initUI()` の直後に新モジュールの `initXxx()` を呼ぶ。
- **毎フレーム**: `app.js` の `tick(now)`。順序 = `stepTimeScale → stepCamera → 分解 → applyExplode → stepBody/stepTheater/applyBody → updateMotors/updateMoveArrow/updateAirflow → updateHover → 影 → render → updateLabels`。新モジュールの `stepXxx(dtSim, dtReal)` は **`stepBody` の直後・`applyBody` の前** に入れる（`body` を書くものはここ）。DOMだけ更新するものは `updateLabels()` の後。
- **状態**: `S`（engine.js）。新規のフラグは `S` に追加してよい（例 `S.scale`, `S.lang`, `S.lesson`）。永続化は `store.get/set('キー')`（`localStorage` の `drone3d.` 接頭辞、try/catch 済み）。
- **機体**: `D = buildDrone(M)` → `{ root, parts, pick, wires, motors, legs, arrows, batPart, G }`。`D.parts[i] = { key, idx, obj, home, homeQuat, explode, meshes, coarse, label, hidden, anim }`。`partsOf(key)` で同名部品の配列（モーターは4本）。`D.motors[i] = { group, prop, propMesh, ghosts, disc, bell, dir, rpm, rpmTarget, rpmRate, pct, part, ... }`。M1前右CCW / M2後右CW / M3後左CCW / M4前左CW、機首は −Z。
- **機体の動き**: `body`（physics.js）= `{px,py,pz, vx,vy,vz, tx,tz, wx,wz, yaw, home, mode:'idle'|'demo'|'free'|'theater', mult:[4], hold, stick, tilt}`。`setBodyMode(mode)`。`applyBody()` が `D.root` に姿勢を書く。`body.mult[i]` はモーターiのRPM倍率（`updateMotors` が `RPM_MAX * S.power * body.mult[i]` を目標にする）。`free.hoverY = 0.06` がホバー基準高さ。
- **色付け**: `setTint(part, THREE.Color, k)`（engine.js）。k=0 で解除。材質は遅延クローンされるので何度呼んでもよい。強調の既定色は `ACCENT`（ui.js, 0xef6a2d）。
- **カード**: `renderNote({ kind, title, badge, html, actions:[{label, fn, primary}], onClose })`（ui.js）。画面に1枚だけ。`kind` は排他制御に使う（既存: flight / question / use / theater / legend）。
- **トースト**: `showToast(msg, ms)`。1レーンのみ。
- **コーチ**: `showCoach(text, sub, go, later)`。
- **選択**: `select(part, all, opts)`, `renderDetail()`, `focusOn(objs, {pull})`, `flyTo(pos, target, dur, pull)`, `setView('iso'|'front'|'top'|'side'|'inside')`。
- **ラベル**: `buildLabels()` が `labelEls` を作り `updateLabels()` が毎フレーム位置決め。`S.labels` で表示、`live`（機体が動いている）中は非表示。
- **タブ**: `setTab('see'|'fly'|'use'|'mishap')`。`#ctx .ctx-row[data-tab]` が文脈行、`#tabs` がタブバー。`theater` 行は再生中だけ出る。
- **深さ**: `S.depth = 'simple'|'full'`、`setDepth()`。`SIMPLE_KEYS`（8部品）、`LIST_ORDER`（40部品、外側→内側の順）。
- **デバッグ**: `window.__d = { S, body, D, theater, air, perf, cam, flyTo, focusOn, camera, controls, step(sec,fps) }`。**ブラウザペインが非表示だと rAF が止まる**（`document.hidden`）。検証は `__d.step(秒)` で同期的に進め、UI操作は `document.querySelector(...).click()` で行う。`performance.now()` ベースの待ちは `step` 内では進まないので、実時間の `await new Promise(r=>setTimeout(r,400))` を挟む。
- **画面取得**: ペイン非表示時はスクリーンショット不可。`document.querySelector('canvas').toDataURL('image/jpeg', .9)` は **`__d.step(1/60)` 直後の同フレーム内なら取れる**（`preserveDrawingBuffer` は不要）。保存が要る場合は scratchpad に `savesrv.py`（127.0.0.1:8943 に POST、`docs/review/<name>.jpg` に保存）を立てて使う。`docs/review/*.jpg` は gitignore 済み。
- **既知の落とし穴**: `at(mesh(geo, x, y, z), mat)` のように引数順を誤ると `position.x` にオブジェクトが入り行列が NaN になって `focusOn` が動かなくなる（正: `at(mesh(geo, mat), x, y, z)`）。`.popover` を `backdrop-filter` 付きの親に置かない。ID セレクタ（`#viewCol button`）は属性セレクタに勝つ。

### 0.5 共通の受け入れ基準（全パッケージ）
1. `python3 build.py` 後、`git status` で `public/index.html` と `artifact.html` が更新され、CI「Build check」が通る。
2. コンソールエラー 0（`read_console_messages` で `?v=N` の新規ログを確認）。
3. デスクトップ 1280×720 とスマホ 375×812（`resize_window mobile`）の両方で、新しいUIが画面内に収まり、`#topbar` の `scrollWidth <= clientWidth`。
4. 機能オフ時に `renderer.info.render.calls` が実装前と同じ（±2以内）。オン時も +40 以内。
5. ダーク／ライト両テーマで文字と図が読める（新しい色は `:root` のトークンで定義し、ダーク側でも再定義）。
6. `prefers-reduced-motion: reduce` で新しい動きが止まるか短いフェードに落ちる。
7. `はじめて` と `くわしく` の両方で破綻しない（はじめてでは情報量を減らす）。
8. 各パッケージの「検証スクリプト」が最後まで例外なく走る。
9. 文言は本書の確定文を使う。**法令の断定を書かない**（「原則」「設定と点検が前提」などの限定を落とさない）。

2. ブラウザペイン `http://localhost:8941/public/index.html?v=<連番>`（launch.json の `drone-3d`）で検証スクリプトを実行。

5. `~/.claude/projects/-Users-kameda-hirofumi-Desktop/memory/drone-anatomy-3d.md` に実装済みパッケージと新しい落とし穴を追記。

## ⑥ 重さ・お金・重心

### 目的
大人が「性能」ではなく「重さと金」で構造を掴めるようにする。狙う瞬間: 「電池がいちばん重くて、いちばん高い」「電池をずらすと前のモーターが忙しくなる」。

### 決定事項（UX）
- 入口: **「つかう」タブの文脈行の右端** に `重さ・お金` チップを1つ追加（`#scaleBtn`、トグル）。オンで **重さモード** `S.scale = true`。用途チップ（`#useChips`）と排他（重さモードに入ると `setUse(null)`、用途を選ぶと重さモードを抜ける）。
- 重さモード中の画面:
  1. **積み上げバー**（DOM、`#massBar`）: 画面右（デスクトップは `#inspector` の左側、スマホは `#noteCard` の上）に縦 220px の細い縦バー。上から重い順にグループ色（`GROUPS[].color`）で積み上げ、各区分に部品名と g を右添え。合計 `2.42 kg` とペットボトル換算 `≒ 500ml ペットボトル 4.8本` をバー下に表示。部品をクリック／ホバーするとその区分が明るくなり、他は薄くなる。区分をクリックすると `select(partsOf(key)[0], true)`。**はじめて** では区分を `SIMPLE_KEYS` の8つ＋「その他」に丸める。
  2. **¥ボタン**（`#priceBtn`、バーの上）: オンでラベルの文字を部品名から参考価格に切替（`labelEls` の `textContent` を差し替える。`buildLabels()` を `S.price` で分岐）。バー下に注記 **「参考価格（2026年時点・国内通販の目安）。機種・時期で大きく変わります」** を必ず表示。合計金額をバー下に出す。
  3. **重心マーカー**: 機体の重心位置に直径 14mm の白黒4分割の球（`cgMarker`、`MeshBasicMaterial`×2 で作る簡易版で可）を `D.root` に置く。重さモード中のみ `visible`。位置は下記の計算式で毎フレーム更新。
  4. **バッテリーのドラッグ**: 重さモード中は `pointerdown` でバッテリー（`D.batPart`）にヒットしたら `controls.enabled=false` にして、**機体の前後方向（ローカル z）にのみ** −0.045〜+0.045 m の範囲で動かす（`screenToDronePlane` で拾ったワールド座標を `D.root.worldToLocal` して z 成分だけ使う）。動かした量 `scale.batDz` は `body` ではなく `scale` 状態に持ち、`applyExplode()` の後で `batPart.obj.position.z = home.z + batDz` を書く（`p.anim` は使わない。シアターと競合するため）。離しても戻さない。「もどす」で 0。
  5. **モーター%への反映**: `body.mult` を書く。式は下記。とばすタブと同じ `#badges`（`updateLabels` 内の `mbadge`）を重さモード中も表示する（現在は `live` 時だけなので、`S.scale` でも出す）。
  6. **偏りすぎ**: 後述の `thrustShare` が **1.35 を超えた側** のバッジを赤（`.mbadge.over`）にし、バー下に「後ろのモーターに余裕がありません。前に進む・風に逆らう余力が減ります」を出す。
  7. **荷物**: バーの上に `荷物: なし / カメラ+250g / 荷物 1kg` のセグメント。`カメラ` は既存 camera 部品の質量を含めるかどうかの切替ではなく「追加ペイロード」として扱う（ゴースト無し、重心計算のみ）。`荷物 1kg` は既存 `buildGhost` で `{shape:'box', size:[0.12,0.08,0.10], pos:[0,-0.13,0.02]}` を `useMat` で描き、重心計算に加える。荷物の前後位置も同じドラッグで動かせる（ヒットしたゴーストを対象にする）。
  8. **人型スケール**: 重さモード中、機体の右横 0.9 m（ワールド +x）に身長 1.70 m の人型を置く（`scene` 直下 `personGroup`）。頭 `SphereGeometry(0.11)`、胴 `CapsuleGeometry(0.16, 0.55)`、脚 `CapsuleGeometry(0.07, 0.75)`×2、腕 `CapsuleGeometry(0.045, 0.55)`×2。材質 `MeshStandardMaterial({color:0x9aa3b0, roughness:.9})`、影を落とす（`castShadow=true`、**影錐台 `key.shadow.camera` は分解と同じロジックで `fs` を 1.2 以上に広げる**）。`userData.noPart = noPick = noAO = true`。重さモードに入ったとき `focusOn([D.root, personGroup])` で両方を収める。**スマホでは人型を置かない**（画面が狭くなる）。代わりにバー下に「身長170cmの人の手のひら〜肘くらいの大きさ」。
- 重さモードを抜けると: マーカー・人型・荷物ゴースト非表示、`batDz = 0`、`body.mult = [1,1,1,1]`、ラベルを名前に戻す。

### 決定事項（計算）
- 質量表 `MASS`（g、**1個あたり**。`count` を掛けて合計）。内部部品（`SUB` に載る bell/stator/… と cells）はバーに出さず、親（motor / battery）に含める。

```js
// キーは ui.js の SUB（bell/stator/winding/magnet/shaft/motorBase→motor, cells→battery, propNut/propAdapter→prop）に載らない「親」だけ。
// motor 95g は内部6種込み、prop 29g はナット3g＋アダプター6g込み。
const MASS = { frameTop: 45, frameBottom: 70, arm: 32, armClamp: 12, motorMount: 14, standoff: 3, screws: 30,
  motor: 95, prop: 29, esc: 26, fc: 30, pdb: 25, capacitor: 8, buzzer: 4,
  battery: 640, xt60: 10, balance: 4, strap: 12, wiring: 60, gps: 45, rx: 18, vtx: 30, led: 4, damper: 5,
  gimbal: 150, camera: 100, batteryTray: 40, remoteId: 25, regMark: 1, telemetry: 30, landingGear: 70 };
// PARTS[key].count を掛けた合計 ≒ 2,421 g。バッテリーが 26% で最大。
```
- 参考価格 `PRICE`（円、1個あたり、2026年時点の国内通販の目安。**例示であり出典は「複数通販サイトの中央値」と表記**）。

```js
const PRICE = { frameTop: 6000, frameBottom: 8000, arm: 3200, armClamp: 900, motorMount: 1200, standoff: 150, screws: 1500,
  motor: 4500, prop: 900, propNut: 150, propAdapter: 400, esc: 3000, fc: 9000, pdb: 3500, capacitor: 300, buzzer: 400,
  battery: 16000, xt60: 300, balance: 200, strap: 400, wiring: 2500, gps: 7000, rx: 6000, vtx: 5000, led: 800, damper: 250,
  gimbal: 40000, camera: 20000, batteryTray: 2500, remoteId: 12000, regMark: 300, telemetry: 8000, landingGear: 2000 };
// 合計 ≒ 25万円前後。「ジンバル+カメラで6万円」「電池1.6万円」を読み取らせる。
```
- 重心（機体ローカル座標、y は無視して x,z のみ）。各部品の位置 = `partsOf(key)` の各 `obj` のワールド位置を `D.root.worldToLocal` した値（`updateWorldMatrix(true,true)` 後）。バッテリーは `batDz` を足す。荷物は上記 `pos` に `dz` を足す。
  `cg = Σ(m_i · p_i) / Σ m_i`。
- 前後のモーターへの配分。モーターはアーム方向 0.275 m（`drone.js` L284 `at(mo.group, 0.275, 0.034, 0)`）、アームは 45° なので前後距離 `L = 0.275 · cos45° ≒ 0.194 m`。
  `share_rear = 1 + cg.z / L`, `share_front = 1 − cg.z / L`（z は機体後方が +）。左右も同様に `share_right = 1 + cg.x / L`。
  各モーター `thrustShare_i = share_frontOrRear × share_leftOrRight`（M1前右, M2後右, M3後左, M4前左）。
  `body.mult[i] = sqrt(thrustShare_i)`（推力∝RPM²）。バッジの % は `updateMotors` の既存式（`rpm / HOVER_RPM`）で自動的に 110% / 89% になる。
  例: `batDz = +0.04` → cg.z ≒ +0.011 → 後ろ 105.5% / 前 94%。`荷物1kg` を +0.05 に置くと cg.z ≒ +0.03 → 後ろ 108% / 前 92%。
- 「余裕なし」判定: `max(thrustShare_i) > 1.35`。

## ⑦ 図鑑とカード

### 目的
説明を読まない人が「未達成の数字」に引かれて全部触る。孫に見せたい人が1タップで画像を持ち帰れる。**バッジ・称号・ランキングは作らない**。数字1つと控えめな光だけ。

### 決定事項（UX）
- **発見の定義**: `select(p)` で部品が選ばれ、その `detail` が 1.5 秒以上表示された（＝読んだ）とき、その `key` を発見済みにする。ラベルクリック・一覧クリック・3Dタップ・質問・シアター経由すべて対象。内部部品（`SUB` の子）も個別に数える。母数は **くわしく 40**（はじめてでも母数は 40 のまま。数字が増える余地を見せる）。
- **表示**: `#inspector` の見出し右の `#partCount` の隣に小さく `12/40`（`#codexCount`、`.count` と同じ体裁、色は `--ink3`）。増えた瞬間だけ 600ms 拡大（`transform: scale(1.15)`）して戻る。トーストは出さない。
- **今日の一部品**: 日付文字列 `YYYY-MM-DD` の簡易ハッシュ（各文字コード和 mod 40）で `LIST_ORDER[n]` を選ぶ。未発見ならその部品を **0.15 → 0.30 の振幅で 2.4 秒周期の呼吸** で `setTint(p, ACCENT, k)`（`stepCodex(dtReal)`）。選択されたら光は止め、`detail` の先頭に **「今日の一部品」バッジ＋豆知識1行**（`TRIVIA[key]`）を出す。発見済みでも豆知識は `detail` に常に出す（見出し「豆知識」、`--ink2`、1行）。
- **全部集まると**: `#codexCount` が `40/40` になった瞬間、`showCoach('全部の部品を見ました', '設計図モードが使えるようになりました。見え方の「設計図」で開けます', go)`。見え方セグメントに 5 つ目 **「設計図」**（`data-mode="blueprint"`、`data-unlock`。未解放時は非表示）を追加。設計図モード＝線画モードの色替え: `paperMat.color = #1d3a6e`、`wireMat.color = #dfe9ff`、背景 `bg` を `['#20416f','#1b365e','#12284a','#0c1c36']`（`applyTheme` 経由でなく `setMode('blueprint')` 内で一時的に上書きし、他モードに戻す時に元に戻す）。解放状態は `store.set('codexDone','1')`。
- **記念写真**: 視点列 `#viewCol` の末尾に 📷（`#photoBtn`）。押すと現在のフレームを撮り、2Dキャンバスで **ポスター**（下記）を作り、`navigator.share({files:[File]})` が使えれば共有シート（LINEにそのまま送れる）、使えなければ `#photoPop`（`.popover`）に画像を表示して「長押しで保存」の案内＋「閉じる」。**ダウンロードリンクは作らない**（Artifact 版では無効）。
  - ポスター: 1600×1200。上 1600×1100 に 3D フレーム（`canvas.toDataURL('image/jpeg', 0.92)` を `drawImage` で cover）。下 100px の帯（`--glass-strong` 相当の白か、ダークなら `#171b22`）に左 `ドローンの構造`（太字 36px）、中央に **選択中の部品名**（無ければ `550クラス クアッドコプター`）、右に日付 `2026.09.11` と `12/40`。フォントは `-apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`。
  - 撮る前に `S.labels` を一時 true にしない（今見えている通りを撮る）。`#labels` の DOM ラベルは写らないので、部品名は帯に入れる。
  - 撮影は `renderer` の描画直後に同期で行う: `tick(performance.now())` を1回呼んでから `toDataURL`（`app.js` に `window.renderOnce = () => tick(performance.now())` を追加して呼ぶ）。
- **控えめさのルール**: 光は `k ≤ 0.30`、音無し、連続日数・ストリークは持たない。未発見の部品名を一覧で先に見せない（一覧は今まで通り）。

（TRIVIA は事実として妥当な範囲で書いてある。実装者は改変せず、誤りを見つけたら **削って空文字** にし、報告する。）

## ⑩ もしもの5場面（⑧より先に実装）

### 目的
住民や家族の「危なくないの？」に、「落ちない」ではなく **「落ちにくくする仕組み」と「人の備え」を対で** 答える材料。⑤が機体の故障なのに対し、こちらは **外の状況** に限る。

### 決定事項（UX）
- 入口: **「もしも」タブ** の文脈行を2段にする。上段 = 既存 `もしも、まちがえたら`（`#mishapCards`）、下段 = **`もしも、外でこうなったら`**（`#whatifCards`、5枚）。スマホは横スクロールのまま2行。**はじめて** では 5 枚全部出す（短い話なので減らさない）。
- 再生中は ⑤ と同じく `body.theater` クラスを付け、右パネル inert、他タブ押下で終了。`#ctx` は `theater` 行を流用し、段階名だけ差し替える（`TH_STAGES` の代わりに `WHATIF_STAGES = ['状況', '機体の反応', '働く部品', 'できること・やること']`）。「つぎへ」で段階送り、`ゆっくり` は無効（小さな動きなので不要。ボタンは隠す）。
- 各場面の流れ（`whatif.js` の小さなタイムライン。`body.mode = 'theater'` を流用し `stepWhatif(dtSim, dtReal)` が `body` を書く）:
  1. **状況**（待ち）: 機体はホバー（`py = free.hoverY`、モーター回転、気流は出さない）。カードに `intro`。ラベル非表示。
  2. **機体の反応**（自動 3〜6 秒）: 下記 `motion` を再生。カードに `reaction` 文。
  3. **働く部品**（自動、部品ごとに 1.2 秒）: `parts` を順に `setTint(p, ACCENT, 1.0)` で点灯し、カードの箇条書きに「1 → 2 → 3」と番号付きで追記していく（点灯済みは 0.35 に落とし、最新だけ 1.0）。同時に `focusOn` はしない（画面が忙しくなる）。代わりに 3D ラベルをその部品だけ表示（`S.labels` を一時 true、`labelEls` を該当 key のみに絞る `S.labelOnly = Set`）。
  4. **できること・やること**（待ち）: カードを 2 欄に（`.two-col`）。左「機体ができること」`can[]`、右「人がやること」`human[]`。最下段に常に **`caveat`**（「設定と点検が前提。万能ではありません」系の限定）。「もう一度」「やめる」。
- 動きの定義（`motion`。値は `body` への書き込み。すべて「小さく」。姿勢は ±8° 以内、移動は 0.25 m 以内。`reduceMotion` なら姿勢変化を 1/3 にする）:
  - `rth`（帰る）: 0〜0.8s ホバー静止 → 0.8〜2.0s `yaw` を +180° へ回頭（`dl` で ω=3）→ 2.0〜4.0s 機首側（回頭後の −z 方向＝元の +z）へ `tx` 6° 傾けて 0.20 m 進む → 4.0〜5.5s `py` を `hoverY` から 0.0 へゆっくり降ろす（着陸）。最後にモーター停止 `M_UPTO(0)`（theater.js の関数を再利用）。
  - `landSlow`（ゆっくり降りる）: 0〜1.0s 静止 → 1.0〜4.0s `py` を 0 へ（`dl` ω=1.2）→ 着地後 0.5s でモーター停止。
  - `driftHold`（GPS 喪失）: 0〜1.5s `px` が +0.06 m 流れる（`dl` ω=1.5）→ 1.5〜2.0s `tx` −4°（止めようとする）→ 2.0〜4.5s `px` を 0.06 に **保持**（戻さない。「位置は保てないが姿勢は保てる」を見せる）→ 高度は一定。
  - `wind`（強風）: 0〜4.5s `tz` を −7°（風上へ傾く）で保持、`px` は ±0.02 の低周波揺れ（0.4 Hz）。`air.mat.uniforms.uWind` を `(0.4, 0, 0)` にして気流を流す（気流を一時 on: `S.air=true` → 終了時に元へ）。モーターは風上側 M1/M4 を `mult 1.15`、風下 M2/M3 を `0.9`。
  - `person`（人が近づいた）: 機体は **動かない**。0〜1.0s 静止 → 1.0s で `py` を +0.03 上げる（少し離れる）→ 以降静止。代わりに **人型**（⑥の `buildPerson` を再利用。⑥未実装なら `CapsuleGeometry` の簡易版を `whatif.js` に置く）を機体の前 1.2 m に置き、1.0〜3.0s で 0.6 m まで近づける。3.0s で機体の LED を全点滅（`led` 部品を `setTint(RED, 0.8)` 0.5 秒周期）。

   - `stopTheater(true)` を最初に呼び、⑤と同時に動かない。`stopWhatif` でも `stopTheater` 側の `theater.active` を触らない。

6. `app.js`: `tick` で `if (whatif.active) stepWhatif(dtSim, dt);` を `stepTheater` の隣に。boot で `initWhatif()`（`buildWhatifCards`）。
7. `physics.js`: `updateAirflow` は `body.v` から風を作っているので、`wind` motion 中だけ `air.mat.uniforms.uWind` を上書きする分岐を `airflow.js` に足す（`air.windOverride` が非 null ならそれを使う）。

### 受け入れ基準
- 5 場面すべてが `状況 → 機体の反応 → 働く部品 → できること・やること` を通り、最後のカードに 2 欄と caveat が出る。
- 姿勢の最大値が 8° 以内（`Math.hypot(body.tx, body.tz) ≤ 0.14 rad`）、移動が 0.25 m 以内。
- 「働く部品」で部品が 1.2 秒ごとに順に点灯し、カードの番号付きリストが同期して増える。
- `signal` で機体が回頭して 0.2 m 進み着陸、`battery` で着陸、`gps` で 6cm 流れて止まる、`wind` で風上へ傾き気流が斜めに流れる、`person` で人型が近づき LED が点滅。
- 終了後 `body.mult` が 1、`S.air` と `uWind` が元に戻る、人型・点灯が消える。⑤のシアターと同時には動かない。

### 検証スクリプト
```js
const d = window.__d; d.step(1, 60); const w = window.__whatif;
document.querySelector('#tabs [data-tab=mishap]').click(); d.step(0.2, 60);
for (const id of ['signal', 'battery', 'gps', 'wind', 'person']) {
  document.querySelector(`#whatifCards button[data-w=${id}]`).click(); d.step(0.5, 60);
  console.assert(w.active && w.phase === 0, id + ' start');
  document.getElementById('thNext').click(); let maxTilt = 0, maxMove = 0;
  for (let i = 0; i < 120 && w.phase < 3; i++) { d.step(0.1, 60); maxTilt = Math.max(maxTilt, Math.hypot(d.body.tx, d.body.tz)); maxMove = Math.max(maxMove, Math.hypot(d.body.px, d.body.pz)); }
  console.assert(w.phase === 3, id + ' reached final', w.phase); console.assert(maxTilt <= 0.14 && maxMove <= 0.26, id + ' small motion', maxTilt, maxMove);
  console.assert(document.querySelector('#noteCard .two-col') && document.querySelector('#noteCard .caveat'), id + ' final card');
  console.assert(document.querySelectorAll('#noteCard .parts-seq li').length === WHATIF.find(x => x.id === id).parts.length, id + ' parts list');
  document.getElementById('thQuit').click(); d.step(0.5, 60);
  console.assert(!w.active && d.body.mult.every(m => Math.abs(m - 1) < 0.02) && !d.S.air, id + ' cleanup');
}
'⑩ OK';
```
（`window.__whatif = whatif` を公開する。）

## ⑧ 生きている機体と、みんなの土台

### 目的
展示の鉄則「動いていないものは見られない」。大きな字・やさしい日本語・読み上げは「配慮」ではなく、教室の後ろの席・投影・外国の受講者を同じ体験に乗せる土台。

### 決定事項（A: 生きている機体）
- `S.alive`（既定 true、`store('alive')` で永続、設定ポップオーバーに「機体を浮かせておく」トグル）。
- **生きている条件**（毎フレーム評価 `aliveWanted()`）: `S.alive && S.tab === 'see' && !S.selected && S.explode < 0.02 && S.mode === 'normal' && !S.question && !theater.active && !whatif.active && !S.lesson && !S.scale && !S.use && !document.hidden`。
- 条件が真になって **0.8 秒** 続いたら `setPower(0.5, true)` + `setBodyMode('free')`（トーストは出さない）。偽になったら **即** `setPower(0, true)`（着陸は既存の idle 遷移に任せる。`stepIdle` が 0.25 秒程度で降ろす）。
- **ラベル**: 生きている間もラベルを出す。`updateLabels()` の `live` 判定を `const live = body.mode !== 'idle' && !(S.alive && body.mode === 'free' && !body.hold && !body.stick.active)` に変える（フリック中・スティック中は今まで通り消える）。ラベルは機体に追従するので位置更新は既存のまま。
- **ポインタの方を向く**: `stepFree` の末尾（physics.js）で `if (S.alive && body.mode === 'free' && !body.hold && !st.active && !ti.active && body.lookYaw != null) body.yaw = dl(body.yaw, body.lookYaw, dt, 2)`。`body.lookYaw` は ui.js の `pointermove`（マウスのみ、`e.pointerType === 'mouse'`）で計算: `screenToDronePlane` のワールド点 `w` から `ang = atan2(w.x − body.px, −(w.z − body.pz))`（機首 −z 基準）、**±4° にクランプ**（`clamp(ang, −0.07, 0.07)`）、ポインタが機体から 0.6 m 以上離れているときは 0 へ。ポインタがキャンバス外に出たら 0。**傾けない**（yaw のみ）。`reduceMotion` なら 0 固定。
- **10 秒放置で回る**: 既存の `autoRotate` は `body.mode === 'idle'` 条件なので、`alive` 中も回るように条件を `(body.mode === 'idle' || (S.alive && body.mode === 'free'))` に緩める。触れば止まる（既存の `controls 'start'` で止まる）。
- **タブ「とばす」との関係**: とばすタブでは既存の挙動（ボタンで回す）。みるタブに戻ると 0.8 秒後にまた浮く。**はじめて／くわしく** 共通。
- **性能**: alive 中は毎フレーム影を更新するため負荷が上がる。`applyQuality` レベル 0〜1 では `S.alive` を強制 false（設定トグルは無効表示にし、注記「軽量画質では止まっています」）。

### 変更ファイルと手順
1. `data.js`: `I18N` 追加。
2. `physics.js`: `body.lookYaw = null` をフィールドに追加、`stepFree` 末尾に look 処理。`stepIdle` は変更なし。
3. 新規 `src/live.js`（SOURCES）: `aliveWanted()`, `stepAlive(dtReal)`（0.8 秒のヒステリシス、`setPower` 呼び出し）, `setAlive(on)`, `setBig(on)`, `updateBigBand()`（ホバー/選択の変化時と `updateHover` から呼ぶ）, `t()`, `partName()`, `partRole()`, `applyLang()`, `setLang()`, `speak()`, `initLive()`。
4. `ui.js`: `pointermove` で `body.lookYaw` を更新、`pointerleave` で null。`updateLabels()` の `live` 判定変更。`buildLabels()` の名前を `partName(p)` に。`renderDetail()` の見出しに `#detailSpeak`。設定ポップに言語セグメント・「機体を浮かせておく」・「自動で読み上げる」。`setTab()` などは変更不要（`aliveWanted` が条件で見る）。`data-i18n` 属性を `index.html` の対象要素に付ける。
5. `app.js`: `tick` の `stepBody` 前に `stepAlive(dt)`；`autoRotate` 条件の緩和；boot で `initLive()`（`applyLang()` を `initUI()` の後に）。
6. `engine.js`: `applyQuality()` の末尾で `if (level <= 1 && S.alive) { S.aliveForcedOff = true }`（`aliveWanted` が見る）。
7. `index.html`/`style.css`: `#bigBand`, `#bigBtn`, `#langSeg`, `#detailSpeak`, `[data-i18n]`。

### 受け入れ基準
- 起動 2 秒後、みるタブで機体が `py ≈ 0.06` でホバーし、ラベルが機体に付いて出ている。部品を選ぶと 0.5 秒以内に降下を始め、選択解除 0.8 秒後に再びホバー。
- マウスを機体の右側に置くと `body.yaw` が −4°〜+4° の範囲で変わり、離すと 0 へ戻る。
- 10 秒放置で自動回転が始まり、ドラッグで止まる。
- 「大きく」で帯が出て、ホバーした部品名が 28px で表示され、3D ラベルが消える。オフで戻る。
- 言語を English にするとタブ・ボタン・8 部品名・12 質問が英語になり、40 部品の解説には「Japanese only」注記が付く。やさしい日本語では 8 部品の役割が分かち書きになる。リロード後も言語が保持される。
- 🔊 で読み上げが始まり、別の部品を押すと前の読み上げが止まる（`speechSynthesis.speaking` で確認）。
- 画質 0〜1 では浮かない。`prefers-reduced-motion` では look が 0。

## ⑨ 授業・説明会モード

### 目的
先生は「開いて 3 秒で授業になるもの」しか使わない。学びは画面ではなく **隣の人との会話** で起こるので、**答えを画面が出さない** 設計にする。前回提案の「プレゼンモード」「URL共有」はここに吸収。

### 決定事項（UX）
- 入口: 設定ポップの最上段に **「授業・説明会」** ボタン（`#lessonBtn`）。押すと `#lessonPop`（`.popover`）にコース 2 枚: `45分授業（中学・高校・初心者）` / `10分住民説明会`。URL `?lesson=class45` / `?lesson=town10` で直接開始（`&step=N` で途中から）。**授業モード中は URL を `history.replaceState` で同期**（`?lesson=class45&step=3`）。これが URL 共有。
- 授業モード `S.lesson = { id, step, startedAt }`:
  - 右パネル `#inspector` を **台本パネル `#lesson`** に差し替える（同じ幅・同じ位置、`aside.glass`。`#inspector` は `hidden`）。スマホでは同じくボトムシート（`#inspector` と同じ `.open` / grabber の仕組みを流用。**実装者の裁量**: 共通の `sheet` クラスに切り出すか、`#lesson` に同じ CSS をコピーするか）。
  - パネル構成: 上 = コース名・`経過 12:30 / 45:00`（`startedAt` から実時間。開始前は `--:--`）・`◀ ▶`。中 = 段落リスト（現在の段落をハイライト、上下スクロール）。各段落 = **見出し・目安時間・講師の言葉（`say`）・問いかけ（`ask`）・想定回答（`expect`、折りたたみ `details`、既定閉）**。下 = `ふたりクイズ` `印刷` `終了` の 3 ボタン。
  - 段落を選ぶ／▶ で進むと **その段落の `act` を実行**（下記）。`act` は `askQuestion`/`setFlight`/`startTheaterUI`/`startWhatifUI`/`setUse`/`setScale`/`setExplode`/`setMode`/`setView`/`select`/`setPower`/`setDepth` の組合せ。`act` の前に必ず `resetStage()`（`stopTheaterUI()`, `stopWhatifUI()`, `clearQuestion()`, `setFlight(null)`, `setUse(null)`, `setScale(false)`, `setExplode(0)`, `setMode('normal')`, `select(null)`, `setPower(0,true)`）。
  - キーボード: `→`/`Space` 次、`←` 前、`Tab`/`Shift+Tab` = **部品めぐり**（下記）、`Q` = ふたりクイズ、`Esc` = 終了確認。スマホ: パネル上で左右スワイプ（既存の grabber 判定と同じ速度・距離条件）。
  - 授業中は `S.alive` を止める（`aliveWanted` の条件に `!S.lesson`）。深さは台本の `depth` に従い、終了時に元へ戻す。
- **部品めぐり**（Tab 順送り）: `LIST_ORDER` を **外→内** に並べた `TOUR_ORDER`（下記）を `Tab` で順に `select(p, true)` + `focusOn`。`Shift+Tab` で戻る。ラベルは選択中の 1 枚だけ表示。授業モード外でも `Tab` で使えるようにしてよい（既存のキーボード到達順と衝突するので **授業モード中のみ** が決定）。
  `TOUR_ORDER = ['prop','propNut','propAdapter','motor','bell','magnet','winding','stator','shaft','motorBase','motorMount','arm','armClamp','frameTop','standoff','frameBottom','screws','esc','pdb','capacitor','xt60','battery','cells','balance','strap','batteryTray','wiring','fc','buzzer','gps','rx','vtx','telemetry','remoteId','led','regMark','damper','gimbal','camera','landingGear']`（40）。
- **ふたりクイズ**（`quiz.js` ではなく `lesson.js` 内）: 開始でラベル全消し、`#noteCard` を「ここ、なんだと思う？」（`kind:'quiz'`）にし、出題部品を **1.2 秒周期の呼吸（k 0.3〜0.9、`ACCENT`）** で光らせ `focusOn`。母数は `S.depth==='simple' ? SIMPLE_KEYS : TOUR_ORDER`、直前 5 問と重複しない。カードのボタンは **`答えを見る`（押すと名前と役割を表示。正誤判定は無い）** と `つぎの問題` と `おわる` のみ。**得点・タイマー・正解音は作らない**。授業モード外からも `設定 > ふたりクイズ` で単独起動できる。
- **印刷**: `印刷` ボタン → `#printSheet`（通常時 `hidden`。`@media print` で `body > *:not(#printSheet)` を `display:none`、`#printSheet` を表示）。内容:
  1. 表紙行: `ドローンの構造 — ワークシート` / コース名 / 日付欄 `____年__月__日` / 名前欄。
  2. **穴埋め図**: 現在の視点で **線画モード** を 1600×1200 で撮った画像（`setMode('wire')` → `renderOnce()` → `toDataURL` → 元のモードへ）。その上に **番号付きの引き出し線** を SVG で重ねる（`labelEls` の位置と同じ計算を `1600×1200` にスケールして描く。番号は `SIMPLE_KEYS` の順、はじめてで 8、くわしくで 16 の `label` 付き部品）。下に `① ______ ② ______ …` の記入欄。
  3. **ふりかえりカード**（3 問、コースごとに固定文。下記 `LESSONS[].review`）。
  4. 印刷 CSS: A4 縦、余白 12mm、図は幅 100%、フォント 11pt、色は黒のみ（線画画像はそのまま）。
  `window.print()` を呼ぶ。印刷後 `#printSheet` は残す（再印刷用）が `hidden`。
- **台本の文言ルール**: 教材で示せる範囲に留める。法令は「原則」「〜が必要とされています」。正誤を画面が判定しない。

### 変更ファイルと手順
1. `data.js`: `LESSONS`, `TOUR_ORDER`。
2. 新規 `src/lesson.js`（SOURCES、`live.js` の後）: `startLesson(id, step)`, `stopLesson()`, `gotoStep(n)`, `runAct(act)`, `resetStage()`, `renderLessonPanel()`, `tickLessonClock()`（1 秒ごとに DOM）, `tourNext(dir)`, `quizStart()`, `quizNext()`, `quizReveal()`, `quizStop()`, `stepQuiz(dtReal)`（呼吸）, `buildPrintSheet()`, `printSheet()`, `initLesson()`（URL パラメータ処理）。
3. `ui.js`: 設定ポップに `#lessonBtn`、`#lessonPop`。キーボードハンドラの先頭で `if (S.lesson && lessonKey(e)) return;`。`select()` は変更なし。`updateLabels()` に `S.labelOnly`（⑩で導入）を尊重。
4. `index.html`: `#lesson`（aside）, `#lessonPop`, `#printSheet`。
5. `style.css`: `#lesson`（`#inspector` と同じ配置）, `.step`, `.step.on`, `.step details`, `#lessonClock`（`font-variant-numeric: tabular-nums`）, `@media print`。
6. `app.js`: `tick` の末尾に `if (S.lesson) tickLessonClock(dt); if (quiz.active) stepQuiz(dt);`、boot で `initLesson()`（`initUI` の後）。
7. `build.py`: 変更なし（SOURCES に追加するだけ）。README に「授業モード: `?lesson=class45`」を 1 行追記。

### 受け入れ基準
- `?lesson=class45` で開くと台本パネルが右（スマホは下）に出て、段落 1 の `act` が実行され、URL が `&step=0` を含む。
- ▶ で段落 2 に進むと視点が上面になり、質問「ccw」が再生される。段落 6 でシアター `propReverse` が始まり、段落 7 でクイズが始まる。各遷移で前の状態（気流・シアター・質問）が残らない。
- 経過時間が実時間で進み、`45:00` を超えても止まらず赤字にならない（叱らない）。
- `Tab` で部品めぐりが `TOUR_ORDER` の順に進み、`Shift+Tab` で戻る。
- ふたりクイズで画面に正誤・得点が出ない。「答えを見る」で名前と役割だけ出る。
- 印刷プレビュー（`window.print` の代わりに `document.body.classList.add('print-preview')` で確認できる開発用クラスを用意）で、線画の穴埋め図（番号 8 個、はじめて時）とふりかえり 3 問が A4 1〜2 枚に収まる。
- 終了で `#inspector` が戻り、深さ・言語・alive が元に戻る。

## 11. 横断の注意（レビュー観点）

1. **排他**: 同時に 1 つしか動かないもの = 質問 / 飛行デモ / 用途 / 重さモード / シアター / もしも外 / クイズ / 授業の act。新しい入口を作ったら、既存の `setTab`, `startTheaterUI`, `askQuestion`, `setUse`, `setFlight` の先頭にある「他を止める」行に **自分を止める行を足す**（双方向）。`docs/design/2026-09-11-ui-spec.md` の「排他ルール」表を更新する。
2. **カードは 1 枚**: `renderNote` の `kind` を新設し、閉じたときの `onClose` で自分の状態を戻す。
3. **ラベルの扱い**: `S.labels`（ユーザー設定）を **上書きしない**。一時的に消す・絞るときは `S.labelOnly`（Set、null で無効）と `S.labelsSuppressed`（bool）を使い、終了時に null/false に戻す。
4. **draw call**: `renderer.info.render.calls` をオン／オフで比べる。新規メッシュは `visible=false` で待機。
5. **スマホ**: 文脈行が長くなるものは `mask-image` の横スクロールに乗せる。新しいパネル（`#massBar`, `#bigBand`, `#lesson`）は `--dock-h` を使って逃がす。
6. **文言**: 本書の確定文をそのまま使う。追加が必要なら「やさしい／断定しない／恐怖をあおらない」を守る。
7. **性能の劣化**: alive（⑧）は影更新が毎フレームになる。画質 0〜1 では無効。p90 が 16.6ms×1.3 を超えたら自動降格するので、降格後に alive が止まることを確認。
8. **テスト**: 各検証スクリプトを `docs/tests/<package>.js` に保存し、README の「検証」節から参照する。

  heads.forEach((h, i) => {

    while (used.has(id)) id += '-'; used.add(id); h.id = id;

  });
  const links = [...toc.querySelectorAll('a')];
  const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id)); } }); }, { rootMargin: '-10% 0px -80% 0px' });
